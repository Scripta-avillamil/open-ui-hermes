services:
  openclaw-chat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-chat
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - OPENCLAW_GATEWAY_URL=${OPENCLAW_GATEWAY_URL:-http://host.docker.internal:8645}
      - OPENCLAW_API_KEY=${OPENCLAW_API_KEY:-any-token}
      - OPENCLAW_MODEL=${OPENCLAW_MODEL:-nous}
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-random-secret}
      - DATABASE_URL=file:/app/data/chat.db
      - NODE_ENV=production
      - HERMES_BIN=${HERMES_BIN:-hermes}
      - HERMES_TIMEOUT=${HERMES_TIMEOUT:-120000}
    volumes:
      - chat-data:/app/data

volumes:
  chat-data:
